<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820">
  <rect width="400" height="820" rx="40" fill="#1e1e1e" />
  <rect x="10" y="10" width="380" height="800" rx="32" fill="#121212" />

  <!-- Header Bar -->
  <rect x="10" y="50" width="380" height="60" fill="#1e1e1e" />
  <text x="30" y="86" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Driver Terminal</text>

  <rect x="280" y="68" width="90" height="28" rx="14" fill="#1b5e20" />
  <circle cx="295" cy="82" r="5" fill="#00E676" />
  <text x="308" y="86" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="bold">ONLINE</text>

  <!-- Main Active Ride Card -->
  <rect x="25" y="130" width="350" height="170" rx="20" fill="#1e1e1e" stroke="#FFC107" stroke-width="1.5" />
  <text x="200" y="160" fill="#FFC107" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ACTIVE RIDE IN PROGRESS</text>
  <text x="200" y="190" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Order #ORD_8892</text>

  <line x1="45" y1="205" x2="355" y2="205" stroke="#333333" stroke-width="1" />

  <text x="80" y="230" fill="#888888" font-family="sans-serif" font-size="11">Current Stage</text>
  <text x="80" y="252" fill="#00E676" font-family="sans-serif" font-size="14" font-weight="bold">ACCEPTED</text>

  <text x="260" y="230" fill="#888888" font-family="sans-serif" font-size="11">GPS Signal</text>
  <text x="260" y="252" fill="#409CFF" font-family="sans-serif" font-size="14" font-weight="bold">Live Stream</text>

  <!-- Map Route Preview -->
  <rect x="25" y="320" width="350" height="340" rx="20" fill="#242f3e" />
  <path d="M 60,360 Q 200,420 320,580" fill="none" stroke="#0066FF" stroke-width="6" stroke-dasharray="8 4" />

  <circle cx="60" cy="360" r="10" fill="#4CAF50" />
  <text x="80" y="365" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Pickup: King Fahd Road</text>

  <circle cx="320" cy="580" r="10" fill="#F44336" />
  <text x="220" y="605" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Dropoff: Airport Gate 3</text>

  <!-- Action Button -->
  <rect x="25" y="680" width="350" height="56" rx="16" fill="#FF9800" />
  <text x="200" y="715" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">I HAVE ARRIVED AT PICKUP</text>
</svg>
