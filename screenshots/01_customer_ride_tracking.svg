<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820">
  <rect width="400" height="820" rx="40" fill="#1e1e1e" />
  <rect x="10" y="10" width="380" height="800" rx="32" fill="#121212" />

  <!-- Status Bar -->
  <text x="35" y="38" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">9:41</text>
  <circle cx="330" cy="34" r="4" fill="#ffffff" />
  <circle cx="345" cy="34" r="4" fill="#ffffff" />
  <rect x="358" y="29" width="18" height="10" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- Map Background -->
  <rect x="10" y="50" width="380" height="520" fill="#242f3e" />

  <!-- Map Roads -->
  <path d="M 30,200 Q 150,180 200,320 T 370,450" fill="none" stroke="#38414e" stroke-width="24" />
  <path d="M 50,480 Q 220,400 350,150" fill="none" stroke="#38414e" stroke-width="18" />

  <!-- Active Route Polyline -->
  <path d="M 110,210 Q 180,240 220,330 T 320,410" fill="none" stroke="#0066FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pickup Marker -->
  <circle cx="110" cy="210" r="14" fill="#4CAF50" fill-opacity="0.3" />
  <circle cx="110" cy="210" r="8" fill="#2E7D32" />

  <!-- Dropoff Marker -->
  <circle cx="320" cy="410" r="14" fill="#F44336" fill-opacity="0.3" />
  <circle cx="320" cy="410" r="8" fill="#C62828" />

  <!-- Driver Live Marker (Car Icon) -->
  <g transform="translate(220, 330) rotate(25)">
    <circle cx="0" cy="0" r="20" fill="#007AFF" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="14" fill="#007AFF" />
    <path d="M -5,-8 L 5,-8 L 7,4 L -7,4 Z" fill="#ffffff" />
  </g>

  <!-- ETA Overlay Card -->
  <rect x="30" y="70" width="340" height="50" rx="14" fill="#000000" fill-opacity="0.85" />
  <text x="50" y="100" fill="#FFC107" font-family="sans-serif" font-size="14" font-weight="bold">8 min away</text>
  <line x1="200" y1="80" x2="200" y2="110" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
  <text x="220" y="100" fill="#4FC3F7" font-family="sans-serif" font-size="14" font-weight="bold">3.4 km</text>

  <!-- Bottom Sheet Card -->
  <rect x="25" y="550" width="350" height="235" rx="24" fill="#1e1e1e" stroke="#333333" stroke-width="1" />

  <!-- Status Badge -->
  <rect x="110" y="568" width="180" height="26" rx="13" fill="#007AFF" fill-opacity="0.2" />
  <circle cx="125" cy="581" r="4" fill="#007AFF" />
  <text x="138" y="585" fill="#409CFF" font-family="sans-serif" font-size="12" font-weight="bold">Driver on the way</text>

  <!-- Progress Timeline -->
  <circle cx="65" cy="620" r="8" fill="#4CAF50" />
  <line x1="73" y1="620" x2="137" y2="620" stroke="#4CAF50" stroke-width="3" />
  <circle cx="145" cy="620" r="8" fill="#007AFF" />
  <line x1="153" y1="620" x2="217" y2="620" stroke="#555555" stroke-width="3" />
  <circle cx="225" cy="620" r="8" fill="#555555" />
  <line x1="233" y1="620" x2="297" y2="620" stroke="#555555" stroke-width="3" />
  <circle cx="305" cy="620" r="8" fill="#555555" />

  <text x="48" y="642" fill="#888888" font-family="sans-serif" font-size="10">Accepted</text>
  <text x="132" y="642" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Arrived</text>
  <text x="210" y="642" fill="#888888" font-family="sans-serif" font-size="10">In Trip</text>
  <text x="285" y="642" fill="#888888" font-family="sans-serif" font-size="10">Finished</text>

  <line x1="45" y1="658" x2="355" y2="658" stroke="#333333" stroke-width="1" />

  <!-- Driver Info -->
  <circle cx="65" cy="695" r="22" fill="#007AFF" />
  <circle cx="65" cy="688" r="7" fill="#ffffff" />
  <path d="M 52,708 Q 65,698 78,708 Z" fill="#ffffff" />
  <text x="100" y="692" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Mohamed Alaa</text>
  <text x="100" y="710" fill="#aaaaaa" font-family="sans-serif" font-size="12">Toyota Camry • ABC 1234</text>

  <!-- Action Buttons -->
  <circle cx="300" cy="695" r="18" fill="#2E7D32" />
  <text x="300" y="700" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CALL</text>
  <circle cx="342" cy="695" r="18" fill="#1565C0" />
  <text x="342" y="700" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CHAT</text>

  <!-- Cancel Button -->
  <rect x="45" y="732" width="310" height="38" rx="10" fill="none" stroke="#F44336" stroke-width="1.5" />
  <text x="200" y="756" fill="#F44336" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cancel Ride</text>
</svg>
