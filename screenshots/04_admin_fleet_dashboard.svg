<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <rect width="1000" height="600" rx="16" fill="#0f172a" />

  <!-- Sidebar -->
  <rect width="220" height="600" fill="#1e293b" />
  <text x="30" y="45" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">DiDi Fleet Admin</text>

  <rect x="15" y="80" width="190" height="40" rx="8" fill="#0284c7" />
  <text x="30" y="105" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Dashboard Overview</text>

  <text x="
  30" y="155" fill="#94a3b8" font-family="sans-serif" font-size="13">Active Rides (Live)</text>
  <text x="30" y="195" fill="#94a3b8" font-family="sans-serif" font-size="13">Drivers &amp; KYC Docs</text>
  <text x="30" y="235" fill="#94a3b8" font-family="sans-serif" font-size="13">Revenue &amp; Commission</text>
  <text x="30" y="275" fill="#94a3b8" font-family="sans-serif" font-size="13">Pricing &amp; Zones Settings</text>

  <!-- Top Stats Row -->
  <g transform="translate(240, 20)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="170" height="90" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="15" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Today Fares</text>
    <text x="15" y="60" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">14,280 SAR</text>

    <!-- Stat 2 -->
    <rect x="185" y="0" width="170" height="90" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="200" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11">System Commission (15%)</text>
    <text x="200" y="60" fill="#4ade80" font-family="sans-serif" font-size="22" font-weight="bold">2,142 SAR</text>

    <!-- Stat 3 -->
    <rect x="370" y="0" width="170" height="90" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="385" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Drivers Online</text>
    <text x="385" y="60" fill="#facc15" font-family="sans-serif" font-size="22" font-weight="bold">142 Drivers</text>

    <!-- Stat 4 -->
    <rect x="555" y="0" width="175" height="90" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="570" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11">Completed Trips</text>
    <text x="570" y="60" fill="#f43f5e" font-family="sans-serif" font-size="22" font-weight="bold">489 Trips</text>
  </g>

  <!-- Live Fleet Map View -->
  <rect x="240" y="130" width="480" height="440" rx="12" fill="#1e293b" stroke="#334155" />
  <rect x="250" y="140" width="460" height="420" rx="8" fill="#1b2431" />

  <text x="270" y="170" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Live Fleet Spatial Map (Riyadh Zone)</text>

  <!-- Roads -->
  <path d="M 270,220 Q 450,280 680,480" fill="none" stroke="#2a364f" stroke-width="12" />
  <path d="M 300,500 Q 500,320 680,200" fill="none" stroke="#2a364f" stroke-width="10" />

  <!-- Live Driver Dots -->
  <circle cx="380" cy="260" r="12" fill="#0284c7" opacity="0.3" />
  <circle cx="380" cy="260" r="6" fill="#38bdf8" />

  <circle cx="520" cy="380" r="12" fill="#0284c7" opacity="0.3" />
  <circle cx="520" cy="380" r="6" fill="#38bdf8" />

  <circle cx="610" cy="240" r="12" fill="#22c55e" opacity="0.3" />
  <circle cx="610" cy="240" r="6" fill="#4ade80" />

  <!-- Driver Verification List Sidebar -->
  <rect x="735" y="130" width="245" height="440" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="750" y="160" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Pending KYC Verifications</text>

  <!-- Driver 1 -->
  <rect x="750" y="180" width="215" height="100" rx="8" fill="#0f172a" />
  <text x="765" y="205" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Driver: Khaled Mansour</text>
  <text x="765" y="223" fill="#94a3b8" font-family="sans-serif" font-size="10">National ID &amp; License Uploaded</text>
  <rect x="765" y="240" width="80" height="26" rx="4" fill="#166534" />
  <text x="805" y="257" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">APPROVE</text>
  <rect x="855" y="240" width="80" height="26" rx="4" fill="#991b1b" />
  <text x="895" y="257" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">REJECT</text>

  <!-- Driver 2 -->
  <rect x="750" y="295" width="215" height="100" rx="8" fill="#0f172a" />
  <text x="765" y="320" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Driver: Youssef Ahmed</text>
  <text x="765" y="338" fill="#94a3b8" font-family="sans-serif" font-size="10">Vehicle Insurance Uploaded</text>
  <rect x="765" y="355" width="80" height="26" rx="4" fill="#166534" />
  <text x="805" y="372" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">APPROVE</text>
  <rect x="855" y="355" width="80" height="26" rx="4" fill="#991b1b" />
  <text x="895" y="372" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">REJECT</text>
</svg>
