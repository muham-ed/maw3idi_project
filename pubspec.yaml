name: maw3idi_project
description: A delivery application project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.2.0
  dartz: ^0.10.1

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.0.1

  # Networking & Data
  dio: ^5.7.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

  # UI & Utils
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  google_maps_flutter: ^2.13.0
  geolocator: ^13.0.2
  intl: ^0.19.0
  socket_io_client: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/